plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codrive.vehicle'
    compileSdk 35

    defaultConfig {
        applicationId 'com.codrive.vehicle'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(project.property('RELEASE_STORE_FILE'))
                storePassword project.property('RELEASE_STORE_PASSWORD')
                keyAlias project.property('RELEASE_KEY_ALIAS')
                keyPassword project.property('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'DEFAULT_SERVER_URL', '"http://10.0.2.2:8080"'
        }
        release {
            def url = project.findProperty('codriveServerUrl') ?: 'https://server.example.com/codrive'
            buildConfigField 'String', 'DEFAULT_SERVER_URL', "\"${url}\""
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.zxing:core:3.5.3'

    implementation 'ai.pleos.playground:Vehicle:2.3.2'
    implementation 'ai.pleos.playground:NaviHelper:3.0.5'

    compileOnly files("${android.sdkDirectory}/platforms/android-35/optional/android.car.jar")

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
