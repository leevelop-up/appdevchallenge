# 개발용 구성: PostgreSQL + CO-DRIVE 서버
# 사용: docker compose up --build   →  http://localhost:8080/join
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codrive
      POSTGRES_USER: codrive
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codrive}
    ports:
      - "5432:5432"
    volumes:
      - codrive-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codrive -d codrive"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./codrive-server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/codrive
      DB_USERNAME: codrive
      DB_PASSWORD: ${DB_PASSWORD:-codrive}
      # QR 에 들어가는 주소. 휴대폰이 접속할 수 있는 주소로 바꿔야 한다. (예: https://codrive.example.com)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      GEOCODING_ENABLED: ${GEOCODING_ENABLED:-true}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-codrive-connect/0.1 (set GEOCODING_USER_AGENT with a contact)}
    ports:
      - "8080:8080"

volumes:
  codrive-db:
